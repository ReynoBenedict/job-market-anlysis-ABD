name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talentscope
          POSTGRES_PASSWORD: talentscope
          POSTGRES_DB: talentscope
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talentscope" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://talentscope:talentscope@localhost:5432/talentscope_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check talentscope tests
      - run: ruff format --check talentscope tests
      - run: mypy talentscope
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talentscope
          POSTGRES_PASSWORD: talentscope
          POSTGRES_DB: talentscope
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talentscope" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://talentscope:talentscope@localhost:5432/talentscope
      API_BASE_URL: http://localhost:8010
      ADMIN_API_TOKEN: ci-admin-token
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install API and import the snapshot
        run: |
          pip install ./backend
          talentscope bootstrap
      - name: Start API
        run: |
          uvicorn --factory talentscope.api.app:create_app --port 8010 &
          timeout 30 bash -c 'until curl -sf localhost:8010/api/v1/health; do sleep 1; done'
      - name: Build web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: End-to-end journeys
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
