[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "talentscope"
version = "0.1.0"
description = "TalentScope API, ingestion pipeline, and analytics for Indonesian job-market data"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.0.55",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    # Data lake: Parquet storage and single-node analytical SQL (docs/adr/0015).
    "duckdb==1.5.6",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
# Engine benchmark only (talentscope lake benchmark); needs Java 8/11/17 for Spark.
bench = [
    "pyspark==3.5.1",
    "psutil==7.2.2",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[project.scripts]
talentscope = "talentscope.cli:main"

[tool.setuptools.packages.find]
include = ["talentscope*"]

[tool.setuptools.package-data]
talentscope = ["migrations/alembic.ini", "migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Indonesian copy legitimately contains en dashes

[tool.ruff.lint.per-file-ignores]
"talentscope/migrations/versions/*" = ["E501"]  # generated by Alembic autogenerate
# Embedded SQL and fixture rows read better unwrapped.
"talentscope/lake/silver.py" = ["E501"]
"talentscope/lake/gold.py" = ["E501"]
"talentscope/lake/benchmark.py" = ["E501"]
"talentscope/lake/commoncrawl/collect.py" = ["E501"]
"talentscope/lake/commands.py" = ["E501"]  # formatted CLI output
"tests/unit/test_lake_pipeline.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "psutil", "pyspark", "pyspark.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["talentscope.migrations.*"]
ignore_errors = true
